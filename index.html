<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de dados da pulseira</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #d32f2f; margin-top: 0; }
        p { font-size: 16px; color: #555; line-height: 1.5; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        strong { color: #222; }
        .btn-link { display: block; text-align: center; margin-top: 15px; color: #0066cc; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-link:hover { text-decoration: underline; color: #004499; }
    </style>
</head>
<body>

    <div id="conteudo" class="card" style="display:none;">
        <h2>🚨 DADOS DE EMERGÊNCIA 🚨</h2>
        <p><strong>Criança:</strong> <span id="nome-crianca"></span></p>
        <p><strong>Idade:</strong> <span id="idade-crianca"></span> anos</p>
        <p><strong>Mãe:</strong> <span id="nome-mae"></span></p>
        <p><strong>Pai:</strong> <span id="nome-pai"></span></p>
        <p><strong>Contato de Emergência:</strong> <span id="telefone-contato"></span></p>
        
        <a href="https://www.google.com/maps/search/delegacia+de+policia+civil/" target="_blank" class="btn-link">
            📍 Encontrar Delegacia Civil Próxima no Mapa
        </a>
    </div>

    <script>
        // URL onde o seu servidor externo está disponibilizando o JSON
    // Substitua por sua URL real ou endpoint da API
    const urlDaApi = 'https://y-lvi1.github.io/?id=8J0XM8Zrb4yh4fyLBA0h';

    async function buscarDadosDaPulseira() {
        try {
        // Faz a requisição GET para puxar o JSON
            const response = await fetch(urlDaApi);
        
            if (response.ok) {
                const dadosJson = await response.json();
            
            // 1. Torna o cartão visível (tira o display:none)
                document.getElementById('conteudo').style.display = 'block';

            // 2. Mapeia os dados do JSON recebido do Flutter para o seu HTML
            // Usamos || "..." para colocar um texto padrão caso o dado venha vazio
                document.getElementById('nome-pai').innerText = dadosJson.nome_pai || "Não informado";
                document.getElementById('telefone-contato').innerText = dadosJson.telefone_contato || "Não informado";
            
            // 3. Como o app atual não manda dados da criança e da mãe, deixamos um aviso padrão
                document.getElementById('nome-crianca').innerText = dadosJson.nome_crianca || "Não cadastrado no App";
                document.getElementById('idade-crianca').innerText = dadosJson.idade_crianca || "--";
                document.getElementById('nome-mae').innerText = dadosJson.nome_mae || "Não cadastrado no App";

            // 4. BÔNUS: Feedback visual de segurança baseado na distância
                const cardElement = document.getElementById('conteudo');
                if (dadosJson.status === 0 || dadosJson.distancia_metros > 8.0) {
                // Se desconectou ou passou de 8 metros, a borda fica vermelha piscante
                    cardElement.style.border = "3px solid #d32f2f";
                } else {
                // Seguro (borda verde)
                    cardElement.style.border = "3px solid #4CAF50";
                }
            }
        } catch (error) {
            console.error("❌ Erro ao buscar os dados:", error);
        }
}

// Executa a busca assim que o site abre
buscarDadosDaPulseira();

// Inicia o "radar": busca atualizações a cada 3 segundos 
// (Sincronizado perfeitamente com o Timer do seu BleController no Flutter)
setInterval(buscarDadosDaPulseira, 3000);
    </script>
</body>
</html>
