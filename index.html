<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de dados da pulseira</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #d32f2f; margin-top: 0; }
        p { font-size: 16px; color: #555; line-height: 1.5; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        strong { color: #222; }
        .btn-link { display: block; text-align: center; margin-top: 15px; color: #0066cc; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-link:hover { text-decoration: underline; color: #004499; }
    </style>
</head>
<body>

    <div id="conteudo" class="card" style="display:none;">
        <h2>🚨 DADOS DE EMERGÊNCIA 🚨</h2>
        <p><strong>Criança:</strong> <span id="nome-crianca"></span></p>
        <p><strong>Idade:</strong> <span id="idade-crianca"></span> anos</p>
        <p><strong>Mãe:</strong> <span id="nome-mae"></span></p>
        <p><strong>Pai:</strong> <span id="nome-pai"></span></p>
        <p><strong>Contato de Emergência:</strong> <span id="telefone-contato"></span></p>
        
        <a href="https://www.google.com/maps/search/delegacia+de+policia+civil+proxima/" target="_blank" class="btn-link">
            📍 Encontrar Delegacia Civil Próxima no Mapa
        </a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwNL5OEZskvmuVnXn82sbX4RNCqSlMsR8",
            authDomain: "registro-pulseira-infantil.firebaseapp.com",
            projectId: "registro-pulseira-infantil",
            storageBucket: "registro-pulseira-infantil.firebasestorage.app",
            messagingSenderId: "999050142406",
            appId: "1:999050142406:web:a662eee5b930215601edc7",
            measurementId: "G-MV122GXXM"
        };
        
        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Pega o ID da URL (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const idBuscado = urlParams.get('id');

        if (idBuscado) {
            // Busca o documento na coleção "Registros"
            db.collection("Registros").doc(idBuscado).get().then((doc) => {
                if (doc.exists) {
                    const dados = doc.data();
                    
                    // Preenche os campos do HTML
                    document.getElementById('nome-crianca').innerText = dados.Nome || "Não informado";
                    document.getElementById('idade-crianca').innerText = dados.Idade !== undefined ? dados.Idade : "Não informada";
                    document.getElementById('nome-mae').innerText = dados.Mãe || "Não informado";
                    document.getElementById('nome-pai').innerText = dados.Pai || "Não informado";
                    document.getElementById('telefone-contato').innerText = dados['Telefone para contato:'] || "Não informado";
                    
                    // Mostra o card na tela
                    document.getElementById('conteudo').style.display = 'block';
                } else {
                    alert("Pulseira ou registro não encontrado no sistema!");
                }
            }).catch((error) => {
                console.error("Erro ao conectar ao Firebase:", error);
                alert("Erro ao buscar dados do servidor.");
            });
        } else {
            alert("Nenhum ID de pulseira foi passado na URL!");
        }
    </script>
</body>
</html>
